<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - iBypass Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <!-- Modal Login Admin -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">🔐 Login Admin</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password Admin</label>
                    <input type="password" id="adminPassword" required placeholder="Masukkan password..." class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- Konten Utama Admin Dashboard -->
    <div id="adminContent" class="max-w-7xl mx-auto hidden">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold text-gray-800">Dashboard Admin - Daftar Pesanan</h1>
            <div class="space-x-2">
                <button onclick="fetchOrders()" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700">
                    🔄 Refresh Data
                </button>
                <button onclick="logoutAdmin()" class="bg-red-500 text-white px-4 py-2 rounded font-semibold hover:bg-red-600">
                    🚪 Logout
                </button>
            </div>
        </div>

        <!-- Tabel Pesanan -->
        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white text-sm">
                        <th class="p-3">No. Order</th>
                        <th class="p-3">Nama Pelanggan</th>
                        <th class="p-3">WhatsApp</th>
                        <th class="p-3">Model Device</th>
                        <th class="p-3">IMEI</th>
                        <th class="p-3">Layanan & Harga</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody" class="divide-y divide-gray-200 text-sm">
                    <tr>
                        <td colspan="8" class="text-center p-4 text-gray-500">Memuat data pesanan...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Password Admin (Bisa Anda ganti sesuai keinginan, contoh: admin123)
        const CORRECT_PASSWORD = "Abdillah312";

        // Cek apakah admin sudah login sebelumnya di sesi browser ini
        window.onload = function() {
            const isLoggedIn = sessionStorage.getItem('isAdminLoggedIn');
            if (isLoggedIn === 'true') {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                fetchOrders();
            }
        };

        // Fungsi Proses Login
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;

            if (pass === CORRECT_PASSWORD) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                fetchOrders();
            } else {
                alert('❌ Password salah! Silakan coba lagi.');
                document.getElementById('adminPassword').value = '';
            }
        }

        // Fungsi Logout
        function logoutAdmin() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                
                const tableBody = document.getElementById('ordersTableBody');
                
                if (!Array.isArray(orders) || orders.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="8" class="text-center p-4 text-gray-500">Belum ada pesanan yang masuk ke database.</td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = '';
                orders.forEach(order => {
                    const waClean = order.customerWhatsapp ? order.customerWhatsapp.replace(/^0/, '62') : '';
                    const waUrl = `https://wa.me/${waClean}?text=Halo%20${encodeURIComponent(order.customerName || '')},%20mengenai%20pesanan%20${order.orderNumber}...`;

                    let statusColor = 'bg-yellow-100 text-yellow-800';
                    if (order.status === 'Diproses') statusColor = 'bg-blue-100 text-blue-800';
                    if (order.status === 'Selesai') statusColor = 'bg-green-100 text-green-800';
                    if (order.status === 'Dibatalkan') statusColor = 'bg-red-100 text-red-800';

                    tableBody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 font-semibold text-blue-600">${order.orderNumber}</td>
                            <td class="p-3 font-medium">${order.customerName}</td>
                            <td class="p-3">
                                <a href="${waUrl}" target="_blank" class="text-green-600 font-bold hover:underline">
                                    💬 ${order.customerWhatsapp}
                                </a>
                            </td>
                            <td class="p-3">${order.deviceModel}</td>
                            <td class="p-3 font-mono text-xs bg-gray-100 p-1 rounded">${order.imei}</td>
                            <td class="p-3">
                                <div>${order.serviceName}</div>
                                <div class="text-xs font-semibold text-gray-600">Rp ${order.price ? order.price.toLocaleString('id-ID') : 0}</div>
                            </td>
                            <td class="p-3">
                                <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${order.status || 'Pending'}</span>
                            </td>
                            <td class="p-3 text-center space-y-1">
                                <select onchange="updateStatus(${order.id}, this.value)" class="border text-xs p-1 rounded bg-white">
                                    <option value="" disabled selected>Ubah Status</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Diproses">Diproses</option>
                                    <option value="Selesai">Selesai</option>
                                    <option value="Dibatalkan">Dibatalkan</option>
                                </select>
                                <br>
                                <button onclick="deleteOrder(${order.id})" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">
                                    🗑️ Hapus
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Gagal mengambil data:', error);
                document.getElementById('ordersTableBody').innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center p-4 text-red-500">Gagal terhubung ke server API.</td>
                    </tr>
                `;
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/orders/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    fetchOrders();
                } else {
                    alert('Gagal mengubah status.');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteOrder(id) {
            if (!confirm('Yakin ingin menghapus pesanan ini?')) return;

            try {
                const res = await fetch(`/api/orders/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    fetchOrders();
                } else {
                    alert('Gagal menghapus pesanan.');
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
