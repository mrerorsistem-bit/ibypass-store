<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBypass Service Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b192c] text-white min-h-screen py-10 px-4 relative overflow-x-hidden">
    
    <!-- Efek Cahaya Latar Belakang ala Apple -->
    <div class="absolute top-10 left-1/2 transform -translate-x-1/2 w-96 h-96 bg-blue-500 opacity-20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-xl mx-auto space-y-6 relative z-10">
        
        <!-- Header / Judul -->
        <div class="text-center space-y-2 mb-6">
            <h1 class="text-3xl font-extrabold tracking-wide text-blue-400"> iBypass Service Store</h1>
            <p class="text-sm text-gray-300">Layanan Profesional Bypass iPhone Cepat & Aman</p>
        </div>

        <!-- Form Order -->
        <div class="bg-[#1e293b]/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-blue-500/30">
            <h2 class="text-xl font-bold text-center text-white mb-6">Form Order Bypass iPhone</h2>
            
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Nama Lengkap</label>
                    <input type="text" id="customerName" required placeholder="Masukkan nama Anda" class="w-full bg-[#0f172a] border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="customerWhatsapp" required placeholder="Contoh: 08123456789" class="w-full bg-[#0f172a] border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Tipe / Model iPhone</label>
                    <input type="text" id="deviceModel" required placeholder="Contoh: iPhone 11 Pro" class="w-full bg-[#0f172a] border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">IMEI (15 Digit)</label>
                    <input type="text" id="imei" required minlength="15" maxlength="15" placeholder="Masukkan 15 digit IMEI" class="w-full bg-[#0f172a] border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Pilih Layanan</label>
                    <select id="serviceSelect" required class="w-full bg-[#0f172a] border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" class="bg-gray-900">-- Pilih Jenis Layanan --</option>
                        <option value="Bypass Hello Screen - Signal" data-price="150000" class="bg-gray-900">Bypass Hello Screen (With Signal) - Rp 150.000</option>
                        <option value="Bypass Passcode / Disabled" data-price="100000" class="bg-gray-900">Bypass Passcode / Disabled - Rp 100.000</option>
                        <option value="Bypass WiFi Only (No Signal)" data-price="80000" class="bg-gray-900">Bypass WiFi Only (No Signal) - Rp 80.000</option>
                        <option value="Remove iCloud Clean" data-price="250000" class="bg-gray-900">Remove iCloud Clean - Rp 250.000</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-xl font-bold hover:from-blue-500 hover:to-indigo-500 transition shadow-lg shadow-blue-600/30">
                    Kirim Pesanan & Konfirmasi WhatsApp
                </button>
            </form>
        </div>

        <!-- Fitur Cek Status Pesanan untuk Pelanggan -->
        <div class="bg-[#1e293b]/80 backdrop-blur-md p-6 rounded-2xl shadow-2xl border border-blue-500/30">
            <h3 class="text-lg font-bold text-white mb-3">🔍 Cek Status Pesanan</h3>
            <div class="flex gap-2">
                <input type="text" id="searchOrderNumber" placeholder="No. Order (misal: ORD-XXXXXX)" class="w-full bg-[#0f172a] border border-gray-700 text-white p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <button onclick="checkOrderStatus()" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold hover:bg-blue-500 transition shadow-md">Cek</button>
            </div>
            <div id="statusResult" class="mt-4 hidden p-4 rounded-xl bg-[#0f172a] border border-gray-700 text-sm space-y-2 text-gray-200">
                <!-- Hasil pencarian -->
            </div>
        </div>

    </div>

    <script>
        const ADMIN_WHATSAPP = "6285277658058"; 

        async function submitOrder(e) {
            e.preventDefault();

            const selectEl = document.getElementById('serviceSelect');
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            const serviceName = selectEl.value;
            const price = parseInt(selectedOption.getAttribute('data-price')) || 0;

            const orderNumber = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const customerName = document.getElementById('customerName').value;
            const customerWhatsapp = document.getElementById('customerWhatsapp').value;
            const deviceModel = document.getElementById('deviceModel').value;
            const imei = document.getElementById('imei').value;

            const orderData = {
                orderNumber,
                customerName,
                customerWhatsapp,
                deviceModel,
                imei,
                serviceName,
                price
            };

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (res.ok) {
                    const message = `Halo Admin, saya ingin memesan jasa bypass.\n\n` +
                                    `*No. Order:* ${orderNumber}\n` +
                                    `*Nama:* ${customerName}\n` +
                                    `*No. WA:* ${customerWhatsapp}\n` +
                                    `*Tipe HP:* ${deviceModel}\n` +
                                    `*IMEI:* ${imei}\n` +
                                    `*Layanan:* ${serviceName}\n` +
                                    `*Harga:* Rp ${price.toLocaleString('id-ID')}\n\n` +
                                    `Nomor Order Anda: *${orderNumber}*. Simpan untuk cek status ya!`;

                    const waUrl = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;

                    alert(`✅ Pesanan berhasil dibuat!\nNo. Order Anda adalah: ${orderNumber}\nSimpan nomor ini untuk mengecek status pesanan.`);
                    window.open(waUrl, '_blank');
                    document.getElementById('orderForm').reset();
                } else {
                    alert('❌ Gagal menyimpan pesanan. Coba lagi.');
                }
            } catch (err) {
                console.error(err);
                alert('❌ Terjadi kesalahan koneksi.');
            }
        }

        async function checkOrderStatus() {
            const orderNum = document.getElementById('searchOrderNumber').value.trim();
            const resultDiv = document.getElementById('statusResult');

            if (!orderNum) {
                alert('Silakan masukkan nomor order terlebih dahulu.');
                return;
            }

            try {
                const res = await fetch(`/api/orders/status/${orderNum}`);
                const data = await res.json();

                resultDiv.classList.remove('hidden');

                if (res.ok) {
                    let badgeColor = 'text-yellow-400 bg-yellow-950/50 border border-yellow-700';
                    if (data.status === 'Diproses') badgeColor = 'text-blue-400 bg-blue-950/50 border border-blue-700';
                    if (data.status === 'Selesai') badgeColor = 'text-green-400 bg-green-950/50 border border-green-700';
                    if (data.status === 'Dibatalkan') badgeColor = 'text-red-400 bg-red-950/50 border border-red-700';

                    resultDiv.innerHTML = `
                        <div class="font-bold text-blue-400">📦 Detail Pesanan: ${data.orderNumber}</div>
                        <div><b>Nama:</b> ${data.customerName}</div>
                        <div><b>Perangkat:</b> ${data.deviceModel}</div>
                        <div><b>Layanan:</b> ${data.serviceName}</div>
                        <div><b>Status Pengerjaan:</b> <span class="px-2 py-0.5 rounded-md font-bold text-xs ${badgeColor}">${data.status}</span></div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="text-red-400 font-semibold">❌ ${data.message}</div>`;
                }
            } catch (err) {
                console.error(err);
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `<div class="text-red-400 font-semibold">❌ Gagal terhubung ke server.</div>`;
            }
        }
    </script>
</body>
</html>
